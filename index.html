<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>prmfazli.com.tr</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #030504;
      color: #f4f7f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 24px;
    }

    /* Arka Plan Matrix Kod Yağmuru */
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0.34;
    }

    /* Ortadaki Yuvarlak Zümrüt Yeşili Arka Işık Halesi */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      height: 520px;
      background: radial-gradient(
        circle,
        rgba(16, 185, 129, 0.32) 0%,
        rgba(5, 150, 105, 0.14) 42%,
        rgba(3, 5, 4, 0) 72%
      );
      filter: blur(28px);
      z-index: 1;
      pointer-events: none;
    }

    /* Ana Terminal Kartı */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 560px;
      padding: 50px 32px 44px;
      text-align: center;
      border-radius: 14px;
      border: 1px solid rgba(52, 211, 153, 0.35);
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.015) 0px,
          rgba(255, 255, 255, 0.015) 1px,
          transparent 1px,
          transparent 3px
        ),
        linear-gradient(155deg, rgba(16, 22, 19, 0.94), rgba(7, 10, 8, 0.97));
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.88),
        0 0 36px rgba(16, 185, 129, 0.14),
        inset 0 0 24px rgba(16, 185, 129, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* İç Köşe Parantezleri */
    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: rgba(52, 211, 153, 0.75);
      border-style: solid;
      pointer-events: none;
    }
    .corner.tl { top: 10px; left: 10px; border-width: 1.5px 0 0 1.5px; }
    .corner.tr { top: 10px; right: 10px; border-width: 1.5px 1.5px 0 0; }
    .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 1.5px 1.5px; }
    .corner.br { bottom: 10px; right: 10px; border-width: 0 1.5px 1.5px 0; }

    /* Tıklanabilir Instagram Rozeti */
    .badge-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #34d399;
      text-decoration: none;
      padding: 8px 20px;
      border-radius: 999px;
      border: 1px solid rgba(52, 211, 153, 0.5);
      background: rgba(16, 185, 129, 0.09);
      box-shadow: 0 0 18px rgba(16, 185, 129, 0.16);
      margin-bottom: 26px;
      transition: all 0.25s ease;
    }

    .badge-link:hover,
    .badge-link:active {
      color: #030504;
      background: #34d399;
      border-color: #34d399;
      box-shadow: 0 0 26px rgba(52, 211, 153, 0.55);
      transform: translateY(-1px);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Ana Başlık */
    h1 {
      font-size: clamp(24px, 5.5vw, 32px);
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: -0.4px;
      color: #ffffff;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
      margin-bottom: 32px;
    }

    /* Loading & Yüzde Barı Alanı */
    .loader-wrapper {
      max-width: 340px;
      margin: 0 auto;
    }

    .loader-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: #34d399;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .loading-dots::after {
      content: '';
      animation: dots 1.6s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    .progress-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .progress-fill {
      position: relative;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #059669, #10b981, #6ee7b7);
      box-shadow: 0 0 14px rgba(52, 211, 153, 0.75);
      transition: width 0.35s ease-out;
      overflow: hidden;
    }

    /* Bar Üzerinde Kayan Parıltı Efekti */
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 60%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.75),
        transparent
      );
      animation: shimmer 1.8s infinite ease-in-out;
    }

    @keyframes shimmer {
      0% { left: -60%; }
      100% { left: 130%; }
    }

    @media (max-width: 480px) {
      .card {
        padding: 42px 22px 38px;
      }
      .ambient-glow {
        width: 340px;
        height: 340px;
      }
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>
  <div class="ambient-glow"></div>

  <main class="card">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>

    <a
      class="badge-link"
      href="https://www.instagram.com/prm.fazli/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram @prm.fazli"
    >
      <span class="badge-dot"></span>
      <span>@PRM.FAZLİ</span>
    </a>

    <h1>Valkor est nimbus,<br>soltera de prax.</h1>

    <div class="loader-wrapper" aria-label="Sistem yükleniyor">
      <div class="loader-header">
        <span>LOADING<span class="loading-dots"></span></span>
        <span id="percent-text">%0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>
  </main>

  <script>
    /* 1. Matrix Kod Yağmuru */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    let width, height, columns, drops;
    const fontSize = 14;
    const chars = '0123456789ABCDEF@#$%&*+=-<>';

    function initMatrix() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      columns = Math.floor(width / fontSize);
      drops = Array.from({ length: columns }, () => Math.floor(Math.random() * -40));
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 5, 4, 0.08)';
      ctx.fillRect(0, 0, width, height);

      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        const isBright = Math.random() > 0.94;
        ctx.fillStyle = isBright ? '#a7f3d0' : '#10b981';
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    initMatrix();
    window.addEventListener('resize', initMatrix);
    setInterval(drawMatrix, 45);

    /* 2. Hiç %100 Olmayan Akıllı Yükleme Sayacı */
    const progressBar = document.getElementById('progress-bar');
    const percentText = document.getElementById('percent-text');
    let currentPercent = 0;
    let direction = 1;

    function updateLoader() {
      if (currentPercent < 84) {
        currentPercent += Math.floor(Math.random() * 6) + 2;
        if (currentPercent > 84) currentPercent = 84;
      } else {
        // %86 ile %94 arasında süresiz dalgalanır, asla %100 olmaz
        currentPercent += direction;
        if (currentPercent >= 94) direction = -1;
        if (currentPercent <= 86) direction = 1;
      }

      progressBar.style.width = currentPercent + '%';
      percentText.textContent = '%' + currentPercent;

      const nextDelay = currentPercent < 84
        ? 110
        : Math.floor(Math.random() * 900) + 600;

      setTimeout(updateLoader, nextDelay);
    }

    setTimeout(updateLoader, 250);
  </script>
</body>
</html>
