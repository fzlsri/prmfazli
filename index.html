<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>prmfazli.com.tr</title>
  <style>

      background-color: #0b0c10;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 640px;
      padding: 48px 32px;

      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 2px;
      color: #ff6b00;
      border: 1px solid rgba(255, 107, 0, 0.4);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 14px;
    }
    p {
      font-size: 15px;
      color: #9ca3af;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">@PRM.FAZLİ // SİSTEM AKTİF</div>
    <h1>Valkor est nimbus, soltera de prax.</h1>
